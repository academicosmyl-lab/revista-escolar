<!-- Barra superior institucional — oculta en móvil -->
<div class="its-topbar">
  <span>Institución Educativa Municipal — Fusagasugá, Cundinamarca</span>
  <span class="its-topbar-lema">Lealtad · Ciencia · Técnica</span>
</div>

<!-- Navbar principal — .scrolled activa glass morphism al bajar 60px -->
<nav class="its-nav" [class.scrolled]="scrolled()">

  <!-- Logo + Nombre -->
  <a routerLink="/" class="its-nav-brand">
    <img src="assets/images/logo-its.png" alt="Escudo Instituto Técnico Industrial" class="its-nav-logo">
    <div class="its-nav-titulo">
      <span class="its-nav-nombre">Instituto Técnico Industrial</span>
      <span class="its-nav-sede">Fusagasugá, Cundinamarca</span>
    </div>
  </a>

  <!-- Botón hamburguesa móvil -->
  <button class="its-hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto">
    <span></span><span></span><span></span>
  </button>

  <!-- Links de navegación -->
  <div class="its-nav-links" [class.abierto]="menuAbierto">
    <a routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Inicio</a>
    <a routerLink="/noticias" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Revista</a>
    <a routerLink="/galeria" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Galería</a>
    <a routerLink="/docentes" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Docentes</a>
    <a routerLink="/sedes" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Sedes</a>
    <a routerLink="/nosotros" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Nosotros</a>
    <a routerLink="/indicadores" routerLinkActive="nav-activo" class="nav-link nav-link-indicadores" (click)="cerrarMenu()">Indicadores</a>
    <a routerLink="/publicar" routerLinkActive="nav-activo" class="nav-link nav-link-publicar" (click)="cerrarMenu()">Publicar</a>

    @if (auth.loggedIn()) {
      @if (auth.esAdmin()) {
        <a routerLink="/super-admin" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Super Admin</a>
      }
      <a routerLink="/panel" routerLinkActive="nav-activo" class="nav-link" (click)="cerrarMenu()">Mi Panel</a>
      <button class="its-btn-primario its-btn-nav" (click)="auth.logout(); cerrarMenu()">Salir</button>
    } @else {
      <a routerLink="/login" class="its-btn-primario its-btn-nav" (click)="cerrarMenu()">Ingresar</a>
    }
  </div>

</nav>
