@if (visible()) {
<div
  class="wi-overlay"
  [class.wi--out]="fadingOut()"
  role="dialog"
  aria-modal="true"
  aria-label="Celebración 90 años Instituto Técnico Industrial Fusagasugá"
>
  <div class="wi-vignette" aria-hidden="true"></div>
  <canvas #particleCanvas class="wi-canvas" aria-hidden="true"></canvas>

  <div class="wi-stage">

    <!-- Escudo 90 años -->
    <div class="wi-block wi-block--shield" [class.wi--show]="showText90()">
      <div class="wi-shield-glow" aria-hidden="true"></div>
      <img
        class="wi-shield-img"
        src="/assets/images/escudo-90-anios.jpg"
        alt="Escudo 90 aniversario Instituto Técnico Industrial Fusagasugá"
        loading="eager"
      />
    </div>

    <!-- Divisor dorado -->
    <div class="wi-divider" [class.wi--show]="showDivider()" aria-hidden="true"></div>

    <!-- Nombre institución -->
    <div class="wi-block wi-block--name" [class.wi--show]="showTitle()">
      <h1 class="wi-name">Instituto Técnico Industrial</h1>
      <p class="wi-sub" [class.wi--show]="showSub()">
        Fusagasugá  ·  1936 – 2026
      </p>
    </div>

  </div>

  @if (showSkip()) {
  <button class="wi-skip" (click)="skip()" aria-label="Omitir introducción">
    Omitir
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <path d="M2 7H12M8.5 3.5L12 7L8.5 10.5" stroke="currentColor" stroke-width="1.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  }

</div>
}
