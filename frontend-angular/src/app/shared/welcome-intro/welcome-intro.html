@if (visible()) {
<div
  class="wi-overlay"
  [class.wi--out]="fadingOut()"
  role="dialog"
  aria-modal="true"
  aria-label="Celebración 90 años Instituto Técnico Industrial Fusagasugá"
>
  <div class="wi-vignette" aria-hidden="true"></div>
  <canvas #particleCanvas class="wi-canvas" aria-hidden="true"></canvas>

  @if (showText90()) {
  <div class="wi-flash" aria-hidden="true"></div>
  }

  <div class="wi-stage">

    <div class="wi-block wi-block--shield" [class.wi--show]="showText90()">
      <div class="wi-shield-glow" aria-hidden="true"></div>
      <img
        class="wi-shield-img"
        src="/assets/images/escudo-90-circular.png"
        alt="Escudo 90 aniversario Instituto Técnico Industrial Fusagasugá"
        loading="eager"
      />
    </div>

    <div class="wi-divider" [class.wi--show]="showDivider()" aria-hidden="true"></div>

    <div class="wi-block wi-block--name" [class.wi--show]="showTitle()">
      <h1 class="wi-name">Instituto Técnico Industrial</h1>
      <p class="wi-sub" [class.wi--show]="showSub()">
        Fusagasugá  ·  1936 – 2026
      </p>
    </div>

  </div>

  @if (showSkip()) {
  <div class="wi-controls">

    <!-- Botón sonido -->
    <button class="wi-sound" (click)="toggleSound()"
      [attr.aria-label]="soundOn() ? 'Silenciar' : 'Activar sonido'">
      @if (soundOn()) {
        <!-- Speaker on -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      } @else {
        <!-- Speaker off -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" opacity="0.45"/>
          <line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      }
    </button>

    <!-- Botón omitir -->
    <button class="wi-skip" (click)="skip()" aria-label="Omitir introducción">
      Omitir
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M2 7H12M8.5 3.5L12 7L8.5 10.5" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>
  }

</div>
}
