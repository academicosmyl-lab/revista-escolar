<section class="login-seccion">
  <div class="login-caja">
    <img src="assets/images/logo-ITI.png" alt="Escudo ITI" class="login-logo">
    <h1 class="login-titulo">Acceso Institucional</h1>
    <p class="login-sub">Panel de docentes y administrativos</p>

    @if (error()) {
      <div class="login-error">{{ error() }}</div>
    }

    <form class="login-form" (ngSubmit)="ingresar()">
      <div class="campo">
        <label for="email">Correo institucional</label>
        <input id="email" type="email" [(ngModel)]="email" name="email"
               placeholder="usuario@ITI.edu.co" class="input-ITI" autocomplete="email">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password"
               placeholder="••••••••" class="input-ITI" autocomplete="current-password">
      </div>
      <button type="submit" class="ITI-btn-primario w-full" [disabled]="cargando()">
        {{ cargando() ? 'Verificando...' : 'Ingresar' }}
      </button>
    </form>

    <a routerLink="/" class="login-volver">← Volver a la revista</a>
  </div>
</section>
