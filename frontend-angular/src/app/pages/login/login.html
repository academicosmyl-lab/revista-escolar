<section class="login-seccion">
  <div class="login-caja">
    <img src="assets/images/logo-its.png" alt="Escudo ITS Santander" class="login-logo">
    <h1 class="login-titulo">Acceso Institucional</h1>
    <p class="login-sub">Panel de docentes y administrativos</p>
    <form class="login-form">
      <div class="campo">
        <label>Correo institucional</label>
        <input type="email" placeholder="usuario@its.edu.co" class="input-its">
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" class="input-its">
      </div>
      <button type="submit" class="its-btn-primario w-full">Ingresar</button>
    </form>
    <a routerLink="/" class="login-volver">← Volver a la revista</a>
  </div>
</section>
