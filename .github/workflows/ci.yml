# .github/workflows/ci.yml
# Pipeline CI/CD — Revista Digital Escolar
# Trigger: push a main

name: CI/CD Revista Escolar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Lint y validación ──────────────────────────
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend

  # ─── Job 2: Tests ──────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-para-ci
          DB_DIALECT: sqlite
          DB_STORAGE: ':memory:'
          ANTHROPIC_API_KEY: test-key

  # ─── Job 3: Build Docker ───────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/revista-escolar-backend:latest

  # ─── Job 4: Deploy (Render / Railway) ─────────────────
  deploy:
    name: Deploy Producción
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        # Para Railway: curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
