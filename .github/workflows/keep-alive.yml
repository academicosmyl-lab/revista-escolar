# .github/workflows/keep-alive.yml
# Ping al backend de Render cada 10 minutos para evitar el cold start

name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Enviando ping a Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}"             --max-time 90             https://revista-escolar.onrender.com/api/v1/health || echo "timeout")
          echo "Render health status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend despierto y saludable."
          else
            echo "Backend respondio $STATUS (puede estar despertando)."
          fi
          exit 0
